# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/docs"
      - "/test/extensions"
    schedule:
      interval: "daily"
    groups:
      all-julia-packages:
        patterns:
          - "*"
    ignore:
      # ModelingToolkitBase's compat for its BifurcationKit extension stops at 0.8, so 0.9 can't
      # be installed or tested yet.
      - dependency-name: "BifurcationKit"
        versions: [">= 0.9"]
      # SciMLBase, ModelingToolkitBase, JumpProcesses and Symbolics, among others, only allow
      # DocStringExtensions up to 0.9.
      - dependency-name: "DocStringExtensions"
        versions: [">= 0.10"]
